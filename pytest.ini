[pytest]
markers =
    unit: testes puros de domínio, normalização e contratos
    integration: testes de integração entre etapas do pipeline
    publication: testes de dashboard, publicação, gráficos e manifestos
    filesystem: testes dependentes de arquivos, snapshots ou estado local
    network: testes que exercitam integrações externas (normalmente mockadas)
    slow: testes que podem exceder o tempo típico da suíte unitária
    stateful: testes que alteram ou dependem de estado local controlado
addopts = --strict-markers
