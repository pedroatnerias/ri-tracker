name: Atualizar dados Nerias

on:
  workflow_dispatch:
    inputs:
      update_mode:
        description: "Tipo de atualizacao"
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - full

permissions:
  contents: read

jobs:
  update-data:
    name: Atualizar e publicar JSONs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ri-tracker
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium do Playwright
        run: python -m playwright install --with-deps chromium

      - name: Executar pipeline Nerias
        run: python update_data.py --resultados resultados --mode "${{ inputs.update_mode }}" --diagnostico-ri

      - name: Gerar graficos Matplotlib
        run: python -m chart_generation --resultados resultados --output-dir resultados/charts

      - name: Validar JSONs gerados
        run: python -m data_publication validate resultados

      - name: Checkout ri-tracker-data
        uses: actions/checkout@v6
        with:
          repository: pedroatnerias/ri-tracker-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo

      - name: Publicar JSONs no repositorio de dados
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: python -m data_publication publish resultados data-repo/data

      - name: Commit e push se houver alteracoes
        working-directory: data-repo
        run: |
          git config user.name "Nerias Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ charts/
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao nos dados."
            exit 0
          fi
          git commit -m "Update Nerias data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin main
