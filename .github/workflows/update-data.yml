name: Atualizar dados Nerias

on:
  workflow_dispatch:
    inputs:
      update_sector:
        description: "Setor"
        required: true
        default: saude
        type: choice
        options:
          - saude
          - construcao_civil
          - all
      update_scope:
        description: "Escopo de atualizacao"
        required: true
        default: all
        type: choice
        options:
          - all
          - financial
          - operational
      update_mode:
        description: "Tipo de atualizacao"
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - full
      refresh_cvm_files:
        description: "Politica dos ZIPs CVM"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - force
          - never
      publish:
        description: "Publicar no ri-tracker-data"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ inputs.publish && 'ri-tracker-data-publication' || format('ri-tracker-no-publish-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  update-data:
    name: Atualizar e publicar JSONs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ri-tracker
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium do Playwright
        run: python -m playwright install --with-deps chromium

      - name: Restaurar cache CVM
        uses: actions/cache@v4
        with:
          path: resultados/**/downloads
          key: cvm-zips-${{ inputs.update_sector }}-${{ inputs.refresh_cvm_files }}-${{ github.run_id }}
          restore-keys: |
            cvm-zips-${{ inputs.update_sector }}-
            cvm-zips-

      - name: Checkout ri-tracker-data para hidratacao
        if: ${{ inputs.publish || inputs.update_scope == 'operational' || inputs.update_scope == 'all' }}
        uses: actions/checkout@v6
        with:
          repository: pedroatnerias/ri-tracker-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo

      - name: Hidratar dados persistidos do setor
        if: ${{ inputs.update_scope == 'operational' || inputs.update_scope == 'all' }}
        env:
          EXTERNAL_FETCH_ENABLED: "false"
        run: python -m pipeline_tasks hydrate-existing-data --data-repo data-repo --resultados resultados --sector "${{ inputs.update_sector }}" --requirements dashboard

      - name: Executar pipeline Nerias
        run: |
          EXTRA_ARGS=""
          if [[ "${{ inputs.update_scope }}" == "operational" || "${{ inputs.update_scope }}" == "all" ]]; then EXTRA_ARGS="--diagnostico-ri"; fi
          python update_data.py --resultados resultados --sector "${{ inputs.update_sector }}" --scope "${{ inputs.update_scope }}" --mode "${{ inputs.update_mode }}" --refresh-cvm-files "${{ inputs.refresh_cvm_files }}" $EXTRA_ARGS

      - name: Gerar graficos Matplotlib
        if: ${{ inputs.update_scope != 'operational' }}
        run: python -m chart_generation --resultados resultados --sector "${{ inputs.update_sector }}"

      - name: Diagnosticar artefatos operacionais
        if: always()
        run: |
          echo "JSONs gerados:"
          find resultados -type f -name "*.json" -print 2>/dev/null | sort || true
          echo "Diretórios operacionais:"
          find resultados -type d \( -iname "*operacional*" -o -iname "*operational*" -o -iname "*construcao*" \) -print 2>/dev/null | sort || true
          echo "Documentos de entrada do setor:"
          find "Releases e relatórios/Entrada/${{ inputs.update_sector }}" -type f -print 2>/dev/null | sort || true
          echo "Documentos convertidos do setor:"
          find "Releases e relatórios/Saída/${{ inputs.update_sector }}" -type f -print 2>/dev/null | sort || true

      - name: Validar JSONs gerados
        run: python -m data_publication validate resultados --scope "${{ inputs.update_scope }}" --sector "${{ inputs.update_sector }}"

      - name: Publicar JSONs no repositorio de dados
        if: ${{ inputs.publish }}
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          UPDATE_MODE: ${{ inputs.update_mode }}
        run: python -m data_publication publish resultados data-repo/data --scope "${{ inputs.update_scope }}" --sector "${{ inputs.update_sector }}"

      - name: Commit e push se houver alteracoes
        if: ${{ inputs.publish }}
        working-directory: data-repo
        run: |
          git config user.name "Nerias Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ charts/
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao nos dados."
            exit 0
          fi
          git commit -m "Update Nerias data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin main

      - name: Resumo da execucao
        if: always()
        run: |
          {
            echo "## Nerias update"
            echo "- setor: ${{ inputs.update_sector }}"
            echo "- scope: ${{ inputs.update_scope }}"
            echo "- mode: ${{ inputs.update_mode }}"
            echo "- refresh_cvm_files: ${{ inputs.refresh_cvm_files }}"
            echo "- publish: ${{ inputs.publish }}"
            echo "- coleta externa: habilitada conforme scope/mode"
          } >> "$GITHUB_STEP_SUMMARY"
