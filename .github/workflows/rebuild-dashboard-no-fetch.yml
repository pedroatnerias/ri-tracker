name: Reconstruir dashboard - sem coleta

on:
  workflow_dispatch:
    inputs:
      sector:
        description: "Setor"
        required: true
        default: all
        type: choice
        options: [all, saude, construcao_civil]
      publish:
        description: "Publicar no ri-tracker-data"
        required: true
        default: false
        type: boolean
      run_tests:
        description: "Executar testes rápidos"
        required: true
        default: true
        type: boolean
      force_rebuild:
        description: "Reconstruir derivados mesmo se existirem"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ inputs.publish && 'ri-tracker-data-publication' || format('ri-tracker-no-publish-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      EXTERNAL_FETCH_ENABLED: "false"
      MPLCONFIGDIR: .matplotlib-cache
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ${{ env.MPLCONFIGDIR }}
          key: matplotlib-font-cache-${{ runner.os }}
      - name: Testes rápidos
        if: ${{ inputs.run_tests }}
        run: python -m unittest discover -s tests -v
      - name: Checkout dos dados publicados
        uses: actions/checkout@v4
        with:
          repository: pedroatnerias/ri-tracker-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: ri-tracker-data
      - name: Restaurar dados existentes
        run: |
          python -m pipeline_tasks hydrate-existing-data \
            --data-repo ri-tracker-data \
            --resultados resultados \
            --sector "${{ inputs.sector }}" \
            --requirements dashboard
      - name: Reconstruir sem coleta
        run: python -m pipeline_tasks rebuild-dashboard-no-fetch --resultados resultados --sector "${{ inputs.sector }}" ${{ inputs.force_rebuild && '--force-rebuild' || '' }}
      - name: Validar manifests
        run: python -m data_publication validate resultados --scope financial --sector "${{ inputs.sector }}"
      - name: Artefatos para inspeção
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: nerias-dashboard-no-fetch-${{ inputs.sector }}
          path: |
            resultados/**/*.json
            resultados/**/charts/**/*.png
      - name: Publicar
        if: ${{ inputs.publish }}
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: python -m data_publication publish resultados ri-tracker-data/data --scope financial --sector "${{ inputs.sector }}"
      - name: Commit e push
        if: ${{ inputs.publish }}
        working-directory: ri-tracker-data
        run: |
          git config user.name "Nerias Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ charts/
          if git diff --cached --quiet; then echo "Nenhuma alteracao."; exit 0; fi
          git commit -m "Rebuild Nerias dashboard no-fetch $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin main
