name: Recalcular indicadores

on:
  workflow_dispatch:
    inputs:
      sector:
        description: "Setor"
        required: true
        default: all
        type: choice
        options: [all, saude, construcao_civil]
      scope:
        description: "Escopo"
        required: true
        default: financial
        type: choice
        options: [all, financial, market, sector_aggregates]
      ticker:
        description: "Ticker ou all"
        required: true
        default: all
      publish:
        description: "Publicar no ri-tracker-data"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ inputs.publish && 'ri-tracker-data-publication' || format('ri-tracker-no-publish-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  recalculate:
    runs-on: ubuntu-latest
    env:
      EXTERNAL_FETCH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - uses: actions/checkout@v6
        with:
          repository: pedroatnerias/ri-tracker-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo
      - name: Restaurar dados publicados
        run: |
          mkdir -p resultados
          cp -R data-repo/data/sectors/. resultados/ || true
      - name: Recalcular sem coleta
        run: python -m pipeline_tasks recalculate-indicators --resultados resultados --sector "${{ inputs.sector }}" --scope "${{ inputs.scope }}"
      - name: Validar manifests
        run: python -m data_publication validate resultados --scope financial --sector "${{ inputs.sector }}"
      - name: Publicar
        if: ${{ inputs.publish }}
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: python -m data_publication publish resultados data-repo/data --scope financial --sector "${{ inputs.sector }}"
      - name: Commit e push
        if: ${{ inputs.publish }}
        working-directory: data-repo
        run: |
          git config user.name "Nerias Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Nenhuma alteracao."; exit 0; fi
          git commit -m "Recalculate Nerias indicators $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin main
      - name: Resumo
        if: always()
        run: |
          echo "## Recalcular indicadores" >> "$GITHUB_STEP_SUMMARY"
          echo "- coleta externa: desativada" >> "$GITHUB_STEP_SUMMARY"
          echo "- setor: ${{ inputs.sector }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- publish: ${{ inputs.publish }}" >> "$GITHUB_STEP_SUMMARY"
